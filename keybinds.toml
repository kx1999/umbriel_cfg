# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]
"Mod+Ctrl+Escape" = "cheatsheet-toggle"
"Mod+O" = { action = "dpms-off", allow_when_locked = true, repeat = false }

# Noctalia
"Mod+Ctrl+W" = { action = "spawn noctalia msg panel-toggle wallpaper" }
"Mod+Ctrl+Shift+W" = "spawn noctalia msg wallpaper-random"
"Mod+S" = { action = "spawn noctalia msg panel-toggle control-center" }
"Mod+Alt+S" = { action = "spawn noctalia msg settings-toggle" }
"Mod+L" = { action = "spawn noctalia msg session lock" }
"Mod+X" = { action = "spawn noctalia msg panel-toggle session" }
"Mod+V" = { action = "spawn noctalia msg panel-toggle clipboard" }
"Mod+Shift+V" = { action = "spawn noctalia msg clipboard-clear && noctalia msg osd-show clipboard-off Clipboard cleared" }
"Mod+Shift+S" = { action = "spawn noctalia msg screenshot-region" }
"Mod+Ctrl+S" = { action = "spawn noctalia msg screenshot-window" }
"Mod+Shift+Ctrl+S" = { action = "spawn noctalia msg screenshot-fullscreen pick" }
"Mod+D" = { action = "spawn noctalia msg notification-dnd-toggle" }
"Mod+B" = { action = "spawn noctalia msg panel-toggle control-center notifications" }
"Mod+Shift+B" = { action = "spawn noctalia msg notification-clear-history && noctalia msg osd-show bell-x Notifications cleared" }
"Mod+Ctrl+P" = { action = "spawn noctalia msg plugin oldirtty/color_picker:service all pick" }
"Mod+Ctrl+C" = { action = "spawn noctalia msg panel-toggle samuelskovbakke/calculator-plus:panel" }
"Mod+Shift+M" = { action = "spawn noctalia msg panel-toggle control-center audio" }

"Alt+Tab" = "spawn noctalia msg window-switcher hold"
"Alt+Shift+Tab" = "spawn noctalia msg window-switcher hold reverse"

# Applications and session
"Mod+K" = { action = "spawn kwi -e yazi", repeat = false }
"Mod+Ctrl+E" = { action = "spawn kwi -e nvim", repeat = false }
"Mod+T" = { action = "spawn kwi", repeat = false }
"Mod" = "spawn noctalia msg panel-toggle launcher"
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Media, volume and brightness keys from any input device, routed through the
# Noctalia shell so its OSDs show. Safe while the session is locked.
# https://docs.noctalia.dev/noctalia/compositor-settings/umbriel
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Custom script to cycle through audio sinks
"Mod+M" = { action = "spawn cycle-sink", allow_when_locked = true, repeat = false }

# Custom discord hotkeys requires local plugin
"Mod+Ctrl+M" = { action = "spawn noctalia msg plugin raycursive/discord-voice:bridge all toggle-mute", allow_when_locked = true, repeat = false }
"Mod+Ctrl+D" = { action = "spawn noctalia msg plugin raycursive/discord-voice:bridge all toggle-deaf", allow_when_locked = true, repeat = false }
"Mod+Ctrl+H" = { action = "spawn noctalia msg plugin raycursive/discord-voice:bridge all hangup", repeat = false }
"Mod+Ctrl+1" = { action = "spawn noctalia msg plugin raycursive/discord-voice:bridge all join-favorite-1", repeat = false }
"Mod+Ctrl+2" = { action = "spawn noctalia msg plugin raycursive/discord-voice:bridge all join-favorite-2", repeat = false }
"Mod+Ctrl+3" = { action = "spawn noctalia msg plugin raycursive/discord-voice:bridge all join-favorite-3", repeat = false }
"Mod+Ctrl+4" = { action = "spawn noctalia msg plugin raycursive/discord-voice:bridge all join-favorite-4", repeat = false }
"Mod+Ctrl+5" = { action = "spawn noctalia msg plugin raycursive/discord-voice:bridge all join-favorite-5", repeat = false }

# Focus and movement
"Mod+N" = "window-focus-or-workspace-down"
"Mod+E" = "window-focus-or-workspace-up"
"Mod+H" = "window-focus-left"
"Mod+I" = "window-focus-right"
"Mod+Ctrl+WheelDown" = { action = "window-focus-right", cooldown_ms = 50 }
"Mod+Ctrl+WheelUp" = { action = "window-focus-left", cooldown_ms = 50 }
"Mod+Shift+N" = "window-move-or-workspace-down"
"Mod+Shift+E" = "window-move-or-workspace-up"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+I" = "column-move-right"
"Mod+Shift+Ctrl+H" = "window-move-left"
"Mod+Shift+Ctrl+I" = "window-move-right"

# Window state and layout
"Mod+F" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+F" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Ctrl+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+A" = "window-cycle-secondary-extent"
"Mod+Shift+A" = "window-set-secondary-extent 1"
"Mod+Ctrl+A" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+Ctrl+A" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+Down" = "column-focus-tab-next"
"Mod+Alt+Up" = "column-focus-tab-previous"
"Mod+Tab" = { action = "overview-toggle", repeat = false }
"Mod+C" = "column-center"

# Workspaces
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 50 }
"Mod+Shift+WheelDown" = { action = "window-move-to-workspace-next", cooldown_ms = 50 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 50 }
"Mod+Shift+WheelUp" = { action = "window-move-to-workspace-previous", cooldown_ms = 50 }

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"

# Scratchpad
"Mod+Space" = "scratchpad-toggle music"

"Mod+F1" = "scratchpad-toggle 1"
"Mod+Shift+F1" = { action = "window-move-to-scratchpad 1", repeat = false }
"Mod+Ctrl+F1" = { action = "window-restore-from-scratchpad 1", repeat = false }

"Mod+F2" = "scratchpad-toggle 2"
"Mod+Shift+F2" = { action = "window-move-to-scratchpad 2", repeat = false }
"Mod+Ctrl+F2" = { action = "window-restore-from-scratchpad 2", repeat = false }

"Mod+F3" = "scratchpad-toggle 3"
"Mod+Shift+F3" = { action = "window-move-to-scratchpad 3", repeat = false }
"Mod+Ctrl+F3" = { action = "window-restore-from-scratchpad 3", repeat = false }

"Mod+F4" = "scratchpad-toggle 4"
"Mod+Shift+F4" = { action = "window-move-to-scratchpad 4", repeat = false }
"Mod+Ctrl+F4" = { action = "window-restore-from-scratchpad 4", repeat = false }

