[colors]
background = "#44475aFF"
text_primary = "#f8f8f2FF"
text_muted = "#d6d8e0FF"
accent_primary = "#bd93f9FF"
accent_secondary = "#ff79c6FF"
warning = "#8be9fdFF"
error = "#ff5555FF"
insert_hint = "#8be9fd80"
backdrop = "#44475aFF"

[colors.border]
focused = "#bd93f9FF"
unfocused = "#44475aFF"
outer = "#282a36FF"

[colors.overview]
background_tint = "#282a3688"
badge = "#bd93f9FF"
workspace_background = "#282a36FF"

[colors.tab_bar]
background = "#44475aFF"
text = "#d6d8e0FF"
